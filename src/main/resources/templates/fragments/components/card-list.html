<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 카드 목록 + 카드 입력 (공용) — 짝 스크립트: static/js/core/components/card-list.js
     목록:  <div th:replace="~{fragments/components/card-list :: cardList('cardList')}"></div>
     입력:  편집 모달(.modal-overlay) 안에 .modal-container 형제로 넣으면 모달 우측에 나란히 열린다.
            <div th:replace="~{fragments/components/card-list :: cardPanel}"></div>
     팝업:  <div th:replace="~{fragments/components/card-list :: cardPicker}"></div>  (모달 밖, 페이지 하단)
     화면 스크립트에서 cardList.init(id, {baseUrl, cardTypeName}) 로 엔드포인트를 알려준다.

     baseUrl 아래에 있어야 하는 엔드포인트
       POST /card/scan      (필수) 장치 리더로 카드번호 읽기
       POST /card/register  (필수) 카드 추가 확인 시 BiostarX 등록
       GET  /card/unassigned(필수) 할당하기 팝업 목록
       GET  /card/byNo      (선택) 스캔한 번호의 기존 카드 — 있으면 패스구분·명칭·상태를 채운다.
                            없는 화면에서도 스캔은 그대로 동작한다(quiet 조회라 오류를 띄우지 않는다). -->
<div th:fragment="cardList(fid)" class="card-list" th:id="${fid}">
  <div class="grid-toolbar">
    <span class="form-hint">카드 추가를 누르면 BiostarX 에 카드가 즉시 등록됩니다. 인원 저장 시 사용자에게 부여됩니다.
      행을 클릭하면 내용을 볼 수 있고, 제외한 카드는 삭제되지 않고 회수되어 다른 인원이 다시 쓸 수 있습니다.</span>
    <div class="grid-actions">
      <button type="button" class="btn card-list-add">카드 추가</button>
    </div>
  </div>
  <table class="grid">
    <thead>
    <tr>
      <th class="w-160">카드번호</th>
      <th class="w-100">패스구분</th>
      <th>카드명칭</th>
      <th class="w-100">카드상태</th>
      <th class="w-80">관리</th>
    </tr>
    </thead>
    <tbody class="card-list-body">
    <tr><td colspan="5" class="empty">등록된 카드가 없습니다.</td></tr>
    </tbody>
  </table>
</div>

<!-- 카드 입력 패널 — 편집 모달 우측에 나란히 (별도 오버레이가 아니라 형제 컨테이너) -->
<div th:fragment="cardPanel" class="modal-container card-side" id="cardModal">
  <div class="modal-header">
    <h2 class="modal-title" id="cardModalTitle">카드 추가</h2>
    <button type="button" class="modal-close" id="cardModalClose">&times;</button>
  </div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group full">
        <label>카드번호 <span class="req">*</span></label>
        <div class="file-field-row">
          <input type="text" id="cardNo" class="input w-160" maxlength="30" inputmode="numeric"
                 placeholder="카드번호" autocomplete="off"/>
          <button type="button" class="btn" id="btnCardScan">SCAN</button>
          <button type="button" class="btn" id="btnCardAssign">할당하기</button>
        </div>
      </div>
      <div class="form-group">
        <label>카드구분 <span class="req">*</span> <span class="form-hint">(고정)</span></label>
        <input type="text" id="cardTypeName" class="input" readonly disabled autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>패스구분 <span class="req">*</span> <span class="form-hint">(클릭하여 선택)</span></label>
        <input type="hidden" id="passType"/>
        <input type="text" id="passTypeName" class="input picker-field" readonly
               data-target="passType" placeholder="클릭하여 선택" autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>카드명칭 <span class="req">*</span></label>
        <input type="text" id="cardName" class="input" maxlength="100" autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>카드상태 <span class="req">*</span> <span class="form-hint">(클릭하여 선택)</span></label>
        <input type="hidden" id="cardStatus"/>
        <input type="text" id="cardStatusName" class="input picker-field" readonly
               data-target="cardStatus" placeholder="클릭하여 선택" autocomplete="off"/>
      </div>
      <div class="form-group full">
        <label>발급료 납부일</label>
        <input type="date" id="cardFeePaidDt" class="input"/>
      </div>
      <div class="form-group full">
        <label>발급근거</label>
        <input type="text" id="cardIssueReason" class="input" maxlength="500" autocomplete="off"/>
      </div>
      <div class="form-group full">
        <label>메모</label>
        <input type="text" id="cardRemark" class="input" maxlength="1000" autocomplete="off"/>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn" id="cardModalCancel">닫기</button>
    <button type="button" class="btn btn-primary" id="cardModalOk">확인</button>
  </div>
</div>

<!-- 미할당 카드 선택 팝업 — 회수되어 다시 쓸 수 있는 카드 목록 -->
<div th:fragment="cardPicker" class="modal-overlay code-picker-overlay" id="cardPickerModal">
  <div class="modal-container wide">
    <div class="modal-header">
      <h2 class="modal-title">카드 할당</h2>
      <button type="button" class="modal-close" id="cardPickerClose" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body">
      <div class="search-keyword" style="margin-bottom:10px">
        <input type="text" id="cardPickerKeyword" class="input"
               placeholder="카드번호 또는 카드명칭으로 검색" autocomplete="off"/>
      </div>
      <p class="form-hint" id="cardPickerInfo">인원에 할당되지 않은(회수된) 카드만 보입니다.</p>
      <div class="matrix-wrap">
        <table class="grid">
          <thead>
          <tr>
            <th class="w-40"></th>
            <th class="w-160">카드번호</th>
            <th class="w-100">패스구분</th>
            <th style="text-align:left">카드명칭</th>
            <th class="w-100">카드상태</th>
          </tr>
          </thead>
          <tbody id="cardPickerBody">
          <tr><td colspan="5" class="empty">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="cardPickerCancel">취소</button>
      <button type="button" class="btn btn-primary" id="cardPickerOk">선택</button>
    </div>
  </div>
</div>
</body>
</html>
