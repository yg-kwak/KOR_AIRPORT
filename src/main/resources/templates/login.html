<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="login-body">
<div class="login-wrap">
  <header class="login-brand">
    <img src="/ic/kac_logo.png" alt="한국공항공사" class="login-logo"/>
    <h1 class="login-title">청주공항 출입관리시스템</h1>
    <p class="login-sub">CHEONGJU AIRPORT · ACCESS CONTROL SYSTEM</p>
  </header>

  <div class="login-card">
    <form method="post" action="/login" class="login-form" autocomplete="off">
      <div class="form-group">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" class="input" autocomplete="off" required autofocus/>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" class="input" autocomplete="new-password" required/>
      </div>
      <p class="login-error" th:if="${error}" th:text="${error}"></p>
      <button type="submit" class="btn btn-primary btn-block login-submit">로그인</button>
    </form>
  </div>

  <footer class="login-footer">계정 문의는 시스템 관리자에게 해주세요.</footer>
</div>
</body>
</html>
