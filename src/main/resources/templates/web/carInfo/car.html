<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/main :: header}"></div>
<div class="layout-container">
  <div th:replace="~{fragments/sidebar :: sidebar(${menus})}"></div>
  <main class="layout-content">
    <h2>차량등록관리</h2>

    <!-- 검색 -->
    <section class="search-section">
      <div class="search-field">
        <label>검색어</label>
        <div class="search-keyword">
          <select id="searchType" class="input w-120">
            <option value="all">전체</option>
            <option value="carNo">차량번호</option>
            <option value="carName">차량명칭</option>
          </select>
          <input type="text" id="keyword" class="input w-300" placeholder="검색어를 입력해주세요" autocomplete="off"/>
        </div>
      </div>
      <button class="btn btn-primary" id="btnSearch">검색</button>
      <button class="btn" id="btnReset">초기화</button>
    </section>

    <!-- 목록 -->
    <section class="content-card">
      <div class="grid-toolbar">
        <span class="grid-total" id="totalInfo"></span>
        <div class="grid-actions">
          <button class="btn" id="btnNew" th:if="${perm.canCreate}">등록</button>
          <button class="btn" id="btnExcel">엑셀 다운로드</button>
          <select id="pageSize" class="input">
            <option value="30">30개씩 보기</option>
            <option value="50">50개씩 보기</option>
            <option value="100">100개씩 보기</option>
            <option value="200">200개씩 보기</option>
          </select>
        </div>
      </div>
      <table class="grid">
        <thead>
        <tr>
          <th class="w-160 sortable" data-sort="carNo">차량번호<span class="sort-ind"></span></th>
          <th class="sortable" data-sort="carName">차량명칭<span class="sort-ind"></span></th>
          <th class="w-160 sortable" data-sort="carType">차종<span class="sort-ind"></span></th>
          <th class="w-160 sortable" data-sort="regDt">등록일<span class="sort-ind"></span></th>
          <th class="w-120">관리</th>
        </tr>
        </thead>
        <tbody id="gridBody">
        <tr><td colspan="5" class="empty">조회 결과가 없습니다.</td></tr>
        </tbody>
      </table>
      <div class="paging" id="paging"></div>
    </section>
  </main>
</div>

<!-- 등록/수정 모달 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-container small">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">차량 등록</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <input type="hidden" id="mode" value="create"/>
        <input type="hidden" id="carId"/>
        <div class="form-group">
          <label>차량번호 <span class="req">*</span></label>
          <input type="text" id="carNo" class="input" placeholder="예: 12가3456" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>차량명칭</label>
          <input type="text" id="carName" class="input" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>차종 <span class="form-hint">(클릭하여 선택)</span></label>
          <input type="hidden" id="carType"/>
          <input type="text" id="carTypeName" class="input picker-field" readonly
                 data-target="carType" placeholder="클릭하여 선택" autocomplete="off"/>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn" id="btnCancel">취소</button>
      <button class="btn btn-primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- 공통 확인/입력/코드팝업 모달 (fragments/components — 제목/내용은 JS 로 주입) -->
<div th:replace="~{fragments/components/confirm-modal :: confirmModal}"></div>
<div th:replace="~{fragments/components/prompt-modal :: promptModal}"></div>
<div th:replace="~{fragments/components/code-picker-modal :: codePicker}"></div>

<!-- 메뉴 권한 → JS 전달 (행 버튼 노출 제어. 서버가 2차로 강제) -->
<script th:inline="javascript">
  window.PAGE_PERM = {
    canCreate: [[${perm.canCreate}]],
    canDelete: [[${perm.canDelete}]]
  };
</script>
<script src="/js/web/carInfo/car.js" defer></script>
</body>
</html>
