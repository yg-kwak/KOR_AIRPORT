<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/main :: header}"></div>
<div class="layout-container">
  <div th:replace="~{fragments/sidebar :: sidebar(${menus})}"></div>
  <main class="layout-content">
    <!-- 제목 줄에 조작을 함께 둔다 — 이 화면은 늘 켜 두고 보는 화면이라
         고르는 일이 드물다. 조회 카드로 한 단을 차지하면 정작 볼 것(사진·로그)이 밀린다. -->
    <div class="monitor-log-bar">
      <h2>이벤트 로그</h2>
      <button class="btn" id="btnPick">단말기 선택</button>
      <button class="btn" id="btnStop" disabled>중지</button>
      <!-- 소리 켜기/끄기 — 인증마다 결과를 읽어 준다. 상황실은 화면을 늘 보고 있지 않아
           소리가 먼저 알린다. 설정은 이 브라우저에 남는다(core/auth-sound.js). -->
      <button type="button" class="btn-sound" id="btnSound" aria-pressed="true"
              title="소리 켜기/끄기" aria-label="소리 켜기/끄기">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="4 9 8 9 13 5 13 19 8 15 4 15"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/>
        </svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="4 9 8 9 13 5 13 19 8 15 4 15"/>
          <line x1="17" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="17" y2="15"/>
        </svg>
      </button>
      <span id="monitorState" class="monitor-state">대기</span>
      <!-- 무엇을 보고 있는지 늘 보인다 — 고른 뒤 접히면 며칠 켜 둔 화면에서 알 길이 없다 -->
      <span class="monitor-log-devices" id="pickedDevices">단말기를 선택하세요</span>
    </div>

    <!-- 두 줄짜리 격자다 — 사진 둘이 같은 줄, [출입자 정보]와 결과가 같은 줄.
         칸을 따로 세우면(열마다 별도 흐름) 왼쪽이 길어질 때 오른쪽만 늘어나 둘의 크기가 어긋난다.
         한 격자에 두면 같은 줄끼리 높이가 저절로 같아진다. -->
    <section class="monitor-log" id="monitorLog">
      <!-- 1줄: 사진 둘 — 남는 높이를 전부 먹어 화면을 채운다 -->
      <div class="monitor-panel">
        <div class="monitor-panel-head">등록 사진</div>
        <div class="monitor-photo" id="logRegistered"></div>
      </div>
      <div class="monitor-panel">
        <div class="monitor-panel-head">인증 사진</div>
        <div class="monitor-photo" id="logAuth"></div>
      </div>

      <!-- 오른쪽 — 지난 인증. 두 줄에 걸쳐 세로로 쌓아 스크롤한다 -->
      <div class="monitor-log-side">
        <h3 class="monitor-log-title">지난 인증 로그</h3>
        <div class="monitor-log-list" id="logHistory"></div>
      </div>

      <!-- 2줄: 출입자 정보와 결과 — 같은 줄이라 크기가 늘 같다 -->
      <div class="monitor-panel">
        <div class="monitor-panel-head">출입자 정보</div>
        <!-- 한 그리드에 8칸(라벨·값 × 4줄) — 줄마다 나누면 라벨 폭이 제각각이라 값의 시작이 어긋난다 -->
        <dl class="monitor-info">
          <dt>이름</dt><dd id="logName">-</dd>
          <dt>소속</dt><dd id="logCompany">-</dd>
          <dt>허가 구역</dt><dd id="logAreas">-</dd>
          <dt>허가 기간</dt><dd id="logPeriod" class="monitor-info-sub">-</dd>
        </dl>
      </div>
      <!-- 출입거부면 초록이 통째로 붉어진다 -->
      <div class="monitor-result" id="logResult">
        <span id="logResultLabel"></span>
        <!-- 어느 문을 지났는지 — 여러 대를 한 화면에서 보므로 결과만으로는 어디인지 알 수 없다 -->
        <span class="monitor-result-device" id="logResultDevice"></span>
      </div>
    </section>
  </main>
</div>

<div th:replace="~{fragments/components/device-picker-modal :: devicePicker}"></div>

<script src="/js/web/monitor/eventLog.js" defer></script>
</body>
</html>
