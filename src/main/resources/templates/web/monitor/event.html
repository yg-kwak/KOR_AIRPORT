<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/main :: header}"></div>
<div class="layout-container">
  <div th:replace="~{fragments/sidebar :: sidebar(${menus})}"></div>
  <main class="layout-content">
    <h2>실시간 이벤트</h2>

    <!-- 조회할 단말기 — 고르기 전에는 아무 것도 흐르지 않는다(장비 전체를 받아 거르지 않는다) -->
    <section class="content-card">
      <div class="setting-form">
        <!-- 장치 선택은 사용자관리와 같은 공통 팝업을 쓴다(검색 가능) -->
        <div class="form-group wider">
          <label for="deviceField">단말기 <span class="req">*</span>
            <span class="form-hint">(클릭하여 BiostarX 장치 선택)</span></label>
          <!-- picker-field 를 쓰지 않는다 — 그 클래스는 공통으로 [삭제] 버튼을 붙이는데,
               여기서는 [중지]가 이미 같은 일(수신 중지 + 선택 해제)을 해서 둘이 겹친다. -->
          <input type="text" id="deviceField" class="input device-field" readonly
                 placeholder="클릭하여 단말기 선택" autocomplete="off"/>
        </div>
        <div class="setting-actions">
          <button class="btn" id="btnStop" disabled>중지</button>
          <!-- 소리 켜기/끄기 — 인증마다 "인증 성공"/"인증 실패"를 읽어 준다.
               상황실은 화면을 늘 보고 있지 않아 소리가 먼저 알린다. 설정은 이 브라우저에 남는다. -->
          <button type="button" class="btn-sound" id="btnSound" aria-pressed="true"
                  title="소리 켜기/끄기" aria-label="소리 켜기/끄기">
            <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="4 9 8 9 13 5 13 19 8 15 4 15"/>
              <path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/>
            </svg>
            <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="4 9 8 9 13 5 13 19 8 15 4 15"/>
              <line x1="17" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="17" y2="15"/>
            </svg>
          </button>
          <span id="monitorState" class="monitor-state">대기</span>
        </div>
      </div>
    </section>

    <!-- MAIN — 마지막 인증 1건. 출입거부면 .deny 가 붙어 초록이 붉게 바뀐다 -->
    <section class="monitor-main" id="monitorMain">
      <div class="monitor-panel">
        <div class="monitor-panel-head">등록 사진</div>
        <div class="monitor-photo" id="mainRegistered"></div>
      </div>
      <div class="monitor-panel">
        <div class="monitor-panel-head">인증 사진</div>
        <div class="monitor-photo" id="mainAuth"></div>
      </div>
      <div class="monitor-panel">
        <div class="monitor-panel-head">출입자 정보</div>
        <!-- 한 그리드에 6칸(라벨·값 × 3줄). 줄마다 그리드를 나누면 라벨 폭이 제각각이라
             값의 시작 위치가 어긋난다 — 한 그리드여야 라벨 열 폭이 가장 긴 라벨로 통일된다.
             세 줄은 남는 높이를 1/3씩 나눠 갖는다(멀리 있는 모니터에서 읽히도록 크게). -->
        <dl class="monitor-info">
          <dt>이름</dt><dd id="mainName">-</dd>
          <dt>소속</dt><dd id="mainCompany">-</dd>
          <dt>허가 구역</dt><dd id="mainAreas">-</dd>
        </dl>
        <div class="monitor-result" id="mainResult"></div>
      </div>
    </section>

    <!-- 지난 인증 로그 — 왼쪽이 오래된 것(7), 오른쪽이 최근(2) -->
    <h3 class="card-title">지난 인증 로그</h3>
    <section class="monitor-history" id="monitorHistory"></section>
  </main>
</div>

<div th:replace="~{fragments/components/device-picker-modal :: devicePicker}"></div>

<script src="/js/web/monitor/event.js" defer></script>
</body>
</html>
