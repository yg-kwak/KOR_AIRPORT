<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/main :: header}"></div>
<div class="layout-container">
  <div th:replace="~{fragments/sidebar :: sidebar(${menus})}"></div>
  <main class="layout-content">
    <h2>설정관리</h2>

    <section class="content-card">
      <div class="setting-form">
        <div class="form-group wide">
          <label>BiostarX IP <span class="req">*</span></label>
          <input type="text" id="biostarIp" class="input" placeholder="예: 192.168.0.10"
                 th:value="${system != null} ? ${system.biostarIp} : ''"/>
        </div>
        <div class="form-group">
          <label>BiostarX ID <span class="req">*</span></label>
          <input type="text" id="biostarId" class="input" autocomplete="off"
                 th:value="${system != null} ? ${system.biostarId} : ''"/>
        </div>
        <div class="form-group wider">
          <label>BiostarX 비밀번호 <span class="form-hint">(변경 시에만 입력)</span></label>
          <input type="password" id="biostarPw" class="input" autocomplete="new-password"
                 placeholder="저장된 비밀번호를 유지하려면 비워두세요"/>
        </div>
        <div class="setting-actions">
          <button class="btn" id="btnTest">연결 테스트</button>
          <button class="btn btn-primary" id="btnSave" th:if="${perm.canCreate}">저장</button>
        </div>
      </div>
    </section>

    <!-- BiostarX 가져오기 — 장비에 이미 있는 정규 사용자를 우리 DB 로 옮긴다(단방향, 장비에 쓰지 않음) -->
    <section class="content-card" th:if="${perm.canCreate}">
      <h3 class="card-title">BiostarX 가져오기</h3>
      <p class="form-hint">
        Biostar X에 등록된 <b>정규 사용자</b>를 출입관리시스템으로 가져옵니다. Biostar X 데이터는 바뀌지 않습니다.<br/>
        기관(사용자그룹)이 매핑된 인원만 대상입니다 — 기관등록관리에서 Biostar X 그룹을 먼저 연결하세요.<br/>
        <b>이미 등록된 인원도 Biostar X 기준으로 맞춥니다</b> — 출입관리시스템에만 있던 카드·출입권한은 사라집니다.
        얼굴은 Biostar X에 없으면 지우고, 양쪽에 있으면 그대로 둡니다.
      </p>
      <div class="setting-form">
        <div class="form-group wide">
          <label>함께 가져올 항목</label>
          <div class="check-row">
            <label><input type="checkbox" id="impCards" checked/> 카드</label>
            <label><input type="checkbox" id="impFace" checked/> 얼굴</label>
            <label><input type="checkbox" id="impAcGroups" checked/> 출입권한</label>
          </div>
        </div>
        <div class="setting-actions">
          <button class="btn" id="btnImportLoad">대상 불러오기</button>
        </div>
      </div>

      <!-- 대상 선택 — 불러오기 전에는 감춰 둔다 -->
      <div id="importPick" style="display:none">
        <div class="search-section">
          <div class="search-field">
            <label>검색어</label>
            <input type="text" id="impKeyword" class="input w-300"
                   placeholder="사용자ID 또는 성명" autocomplete="off"/>
          </div>
          <div class="search-field">
            <!-- 미리보기 전에는 신규/등록됨, 미리보기 뒤에는 신규/갱신/변경없음 — 목록의 구분 열과 같은 값이다 -->
            <label>구분</label>
            <select id="impStateFilter" class="input w-140">
              <option value="">전체</option>
              <option value="신규">신규</option>
              <option value="등록됨">등록됨</option>
              <option value="갱신">갱신(미리보기)</option>
              <option value="변경없음">변경없음(미리보기)</option>
            </select>
          </div>
          <div class="search-field">
            <!-- 장비의 카드·얼굴 보유 여부 — 목록 조회에 개수가 함께 와서 추가 호출 없이 거를 수 있다 -->
            <label>보유</label>
            <select id="impHasFilter" class="input w-140">
              <option value="">전체</option>
              <option value="card">카드 있음</option>
              <option value="nocard">카드 없음</option>
              <option value="face">얼굴 있음</option>
              <option value="noface">얼굴 없음</option>
              <option value="both">카드+얼굴 있음</option>
            </select>
          </div>
          <button class="btn" id="btnImportPreview">미리보기</button>
          <button class="btn btn-primary" id="btnImportRun">가져오기</button>
        </div>
        <div class="grid-toolbar">
          <span class="grid-total" id="impTotal"></span>
          <span class="imp-pager">
            <button type="button" class="btn btn-sm" id="impPrev">이전</button>
            <span id="impPageInfo"></span>
            <button type="button" class="btn btn-sm" id="impNext">다음</button>
          </span>
        </div>
        <div class="modal-table-scroll">
          <table class="grid">
            <thead>
            <tr>
              <th class="w-60"><input type="checkbox" id="impCheckAll"/></th>
              <th class="w-140">사용자ID</th>
              <th class="w-140">성명</th>
              <th class="w-160">기관</th>
              <th class="w-80">카드</th>
              <th class="w-80">얼굴</th>
              <th class="w-100">구분</th>
              <th>비고</th>
            </tr>
            </thead>
            <tbody id="impBody">
            <tr><td colspan="8" class="empty">대상이 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <pre id="importResult" class="import-result" style="display:none"></pre>
    </section>
  </main>
</div>

<div th:replace="~{fragments/components/confirm-modal :: confirmModal}"></div>

<script th:inline="javascript">
  window.PAGE_PERM = { canCreate: [[${perm.canCreate}]], canDelete: [[${perm.canDelete}]] };
</script>
<script src="/js/web/system/system.js" defer></script>
</body>
</html>
