<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('임시인원등록')}"></head>
<body>
<div th:replace="~{fragments/main :: header}"></div>
<div class="layout-container">
  <div th:replace="~{fragments/sidebar :: sidebar(${menus})}"></div>
  <main class="layout-content">
    <h2>임시인원등록</h2>

    <section class="search-section">
      <div class="search-field">
        <label>방문유형</label>
        <input type="hidden" id="typeFilter"/>
        <input type="text" id="typeFilterName" class="input w-160 picker-field" readonly
               data-target="typeFilter" placeholder="전체 (클릭하여 선택)" autocomplete="off"/>
      </div>
      <div class="search-field">
        <label>상태</label>
        <input type="hidden" id="statusFilter"/>
        <input type="text" id="statusFilterName" class="input w-160 picker-field" readonly
               data-target="statusFilter" placeholder="전체 (클릭하여 선택)" autocomplete="off"/>
      </div>
      <div class="search-field">
        <label>검색어</label>
        <input type="text" id="keyword" class="input w-300" placeholder="업체명 또는 작업목적"/>
      </div>
      <button class="btn btn-primary" id="btnSearch">검색</button>
      <button class="btn" id="btnReset">초기화</button>
    </section>

    <section class="content-card">
      <div class="grid-toolbar">
        <span class="grid-total" id="totalInfo"></span>
        <div class="grid-actions">
          <button class="btn" id="btnNew" th:if="${perm.canCreate}">등록</button>
          <select id="pageSize" class="input">
            <option value="30">30개씩 보기</option>
            <option value="50">50개씩 보기</option>
            <option value="100">100개씩 보기</option>
          </select>
        </div>
      </div>
      <table class="grid">
        <thead>
        <tr>
          <th class="w-100 sortable" data-sort="visitNo">번호<span class="sort-ind"></span></th>
          <th class="w-100">방문유형</th>
          <th class="sortable" data-sort="companyName">업체명<span class="sort-ind"></span></th>
          <th class="w-260 sortable" data-sort="workStartDt">작업기간<span class="sort-ind"></span></th>
          <th class="w-80">방문객</th>
          <th class="w-80">차량</th>
          <th class="w-100">상태</th>
          <th class="w-80">관리</th>
        </tr>
        </thead>
        <tbody id="gridBody">
        <tr><td colspan="8" class="empty">조회 결과가 없습니다.</td></tr>
        </tbody>
      </table>
      <div class="paging" id="paging"></div>
    </section>
  </main>
</div>

<!-- 등록/수정 모달 (탭: 그룹정보 / 인솔자 / 방문객 / 차량) -->
<div class="modal-overlay" id="editModal">
  <div class="modal-container wide visit-modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">임시인원 등록</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="visitNo"/>
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="group">그룹정보</button>
        <button type="button" class="tab-btn" data-tab="mgr">인솔자</button>
        <button type="button" class="tab-btn" data-tab="vis">방문객</button>
        <button type="button" class="tab-btn" data-tab="car">차량</button>
      </div>

      <!-- 탭1: 그룹정보 -->
      <div class="tab-panel active" id="tab-group">
        <div class="form-grid">
          <div class="form-group">
            <label>방문유형</label>
            <input type="hidden" id="visitType"/>
            <input type="text" id="visitTypeName" class="input" readonly
                   value="임시" placeholder="임시" autocomplete="off"/>
          </div>
          <div class="form-group">
            <label>상태 <span class="form-hint">(클릭하여 선택)</span></label>
            <input type="hidden" id="statusCode"/>
            <input type="text" id="statusName" class="input picker-field" readonly
                   data-target="statusCode" placeholder="신청" autocomplete="off"/>
          </div>
          <div class="form-group">
            <label>업체명 <span class="req">*</span></label>
            <input type="text" id="companyName" class="input" maxlength="100" autocomplete="off"/>
          </div>
          <div class="form-group">
            <label>업체구분</label>
            <input type="text" id="companyType" class="input" maxlength="100" autocomplete="off"/>
          </div>
          <div class="form-group">
            <label>작업기간 시작</label>
            <input type="datetime-local" id="workStartDt" class="input" max="2037-12-31T23:59"/>
          </div>
          <div class="form-group">
            <label>작업기간 종료</label>
            <input type="datetime-local" id="workEndDt" class="input" max="2037-12-31T23:59"/>
          </div>
          <div class="form-group">
            <label>허가일자</label>
            <input type="date" id="permitDt" class="input"/>
          </div>
          <div class="form-group">
            <label>수령자</label>
            <input type="text" id="receiver" class="input" maxlength="100" autocomplete="off"/>
          </div>
          <div class="form-group">
            <label>반납자</label>
            <input type="text" id="returner" class="input" maxlength="100" autocomplete="off"/>
          </div>
          <div class="form-group full">
            <label>작업목적</label>
            <input type="text" id="workPurpose" class="input" maxlength="500" autocomplete="off"/>
          </div>
          <div class="form-group full">
            <label>메모</label>
            <input type="text" id="remark" class="input" maxlength="1000" autocomplete="off"/>
          </div>
        </div>

        <div class="form-group-label" style="margin-top:12px">사용자 출입그룹</div>
        <div th:replace="~{fragments/components/ac-group-tree :: acGroupTree('acTree')}"></div>

        <div class="form-group-label" style="margin-top:12px">차량 출입그룹</div>
        <div class="ac-select-tree" id="carAcBox"><div class="empty">불러오는 중...</div></div>
      </div>

      <!-- 탭2: 인솔자 -->
      <div class="tab-panel" id="tab-mgr">
        <div class="grid-toolbar" style="padding:0 0 8px">
          <span class="form-hint">인솔자는 정규인원(PT01)에서 선택합니다.</span>
          <div class="grid-actions"><button type="button" class="btn btn-sm" id="btnAddMgr">인솔자 추가</button></div>
        </div>
        <table class="grid">
          <thead><tr><th class="w-160">인원ID</th><th>성명</th><th class="w-80">관리</th></tr></thead>
          <tbody id="mgrBody"><tr><td colspan="3" class="empty">인솔자가 없습니다.</td></tr></tbody>
        </table>
      </div>

      <!-- 탭3: 방문객 -->
      <div class="tab-panel" id="tab-vis">
        <div class="grid-toolbar" style="padding:0 0 8px">
          <span class="form-hint">방문객 성명·생년월일·소속과 카드(선택)를 입력합니다.</span>
          <div class="grid-actions"><button type="button" class="btn btn-sm" id="btnAddVis">방문객 추가</button></div>
        </div>
        <table class="grid">
          <thead><tr><th class="w-160">성명 *</th><th class="w-140">생년월일</th><th>소속</th>
            <th class="w-200">카드</th><th class="w-80">관리</th></tr></thead>
          <tbody id="visBody"><tr><td colspan="5" class="empty">방문객이 없습니다.</td></tr></tbody>
        </table>
      </div>

      <!-- 탭4: 차량 -->
      <div class="tab-panel" id="tab-car">
        <div class="grid-toolbar" style="padding:0 0 8px">
          <span class="form-hint">차량은 선택입니다. 차량번호·명칭·차종과 카드(선택)를 입력합니다.</span>
          <div class="grid-actions"><button type="button" class="btn btn-sm" id="btnAddCar">차량 추가</button></div>
        </div>
        <table class="grid">
          <thead><tr><th class="w-160">차량번호</th><th>차량명칭</th><th class="w-120">차종</th>
            <th class="w-200">카드</th><th class="w-80">관리</th></tr></thead>
          <tbody id="carBody"><tr><td colspan="5" class="empty">차량이 없습니다.</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger modal-footer-left" id="btnDelete" th:if="${perm.canDelete}" style="display:none">삭제</button>
      <button class="btn" id="btnCancel">취소</button>
      <button class="btn btn-primary" id="btnSave" th:if="${perm.canCreate}">저장</button>
    </div>
  </div>

  <!-- 인솔자 선택 팝업 -->
  <div class="modal-container card-side" id="mgrModal">
    <div class="modal-header">
      <h2 class="modal-title">인솔자 선택</h2>
      <button type="button" class="modal-close" id="mgrClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="search-keyword" style="margin-bottom:10px">
        <input type="text" id="mgrKeyword" class="input" style="flex:1" placeholder="인원ID로 검색" autocomplete="off"/>
      </div>
      <div class="matrix-wrap">
        <table class="grid">
          <thead><tr><th class="w-40"></th><th class="w-160">인원ID</th><th style="text-align:left">성명</th></tr></thead>
          <tbody id="mgrPickBody"><tr><td colspan="3" class="empty">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="mgrCancel">취소</button>
      <button type="button" class="btn btn-primary" id="mgrOk">선택</button>
    </div>
  </div>
</div>

<div th:replace="~{fragments/components/confirm-modal :: confirmModal}"></div>
<div th:replace="~{fragments/components/code-picker-modal :: codePicker}"></div>

<script th:inline="javascript">
  window.PAGE_PERM = { canCreate: [[${perm.canCreate}]], canDelete: [[${perm.canDelete}]] };
</script>
<script src="/js/web/visitor/visitor.js" defer></script>
</body>
</html>
