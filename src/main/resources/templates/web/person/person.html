<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('정규인원등록')}"></head>
<body>
<div th:replace="~{fragments/main :: header}"></div>
<div class="layout-container">
  <div th:replace="~{fragments/sidebar :: sidebar(${menus})}"></div>
  <main class="layout-content">
    <h2>정규인원등록</h2>

    <!-- 검색 -->
    <section class="search-section">
      <div class="search-field">
        <label>기관</label>
        <input type="hidden" id="companyFilter"/>
        <input type="text" id="companyFilterName" class="input w-160 picker-field" readonly
               data-target="companyFilter" placeholder="전체 (클릭하여 선택)" autocomplete="off"/>
      </div>
      <div class="search-field">
        <label>검색어</label>
        <div class="search-keyword">
          <select id="searchType" class="input w-120">
            <option value="all">전체</option>
            <option value="personId">인원ID</option>
            <option value="mainTask">주요업무</option>
          </select>
          <input type="text" id="keyword" class="input w-300" placeholder="검색어를 입력해주세요"/>
        </div>
      </div>
      <button class="btn btn-primary" id="btnSearch">검색</button>
      <button class="btn" id="btnReset">초기화</button>
    </section>

    <!-- 목록 -->
    <section class="content-card">
      <div class="grid-toolbar">
        <span class="grid-total" id="totalInfo"></span>
        <div class="grid-actions">
          <button class="btn" id="btnNew" th:if="${perm.canCreate}">등록</button>
          <select id="pageSize" class="input">
            <option value="30">30개씩 보기</option>
            <option value="50">50개씩 보기</option>
            <option value="100">100개씩 보기</option>
          </select>
        </div>
      </div>
      <table class="grid">
        <thead>
        <tr>
          <th class="w-160 sortable" data-sort="personId">인원ID<span class="sort-ind"></span></th>
          <th class="w-120">성명</th>
          <th class="sortable" data-sort="companyName">기관<span class="sort-ind"></span></th>
          <th class="w-120">직위</th>
          <th class="w-100 sortable" data-sort="statusCode">상태<span class="sort-ind"></span></th>
          <th class="w-200 sortable" data-sort="accessEndDt">출입기간<span class="sort-ind"></span></th>
          <th class="w-100">BiostarX</th>
          <th class="w-100">관리</th>
        </tr>
        </thead>
        <tbody id="gridBody">
        <tr><td colspan="8" class="empty">조회 결과가 없습니다.</td></tr>
        </tbody>
      </table>
      <div class="paging" id="paging"></div>
    </section>
  </main>
</div>

<!-- 등록 모달 (탭: 사용자 정보 / 사용자 권한 / 카드정보) -->
<div class="modal-overlay" id="editModal">
  <div class="modal-container wide">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">정규인원 등록</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="info">사용자 정보</button>
        <button type="button" class="tab-btn" data-tab="auth">사용자 권한</button>
        <button type="button" class="tab-btn" data-tab="card">카드정보</button>
      </div>

      <!-- 탭1: 사용자 정보 -->
      <div class="tab-panel active" id="tab-info">
        <form id="editForm">
          <div class="form-grid">
            <div class="form-group">
              <label>인원ID <span class="req">*</span></label>
              <input type="text" id="personId" class="input" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>성명 <span class="req">*</span></label>
              <input type="text" id="personName" class="input" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>생년월일</label>
              <input type="text" id="birthDate" class="input" placeholder="예: 1990-01-01" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>연락처</label>
              <input type="text" id="personPhone" class="input" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>기관 <span class="req">*</span> <span class="form-hint">(클릭하여 선택)</span></label>
              <input type="hidden" id="companyCode"/>
              <input type="text" id="companyName" class="input picker-field" readonly
                     data-target="companyCode" placeholder="클릭하여 선택" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>직위 <span class="form-hint">(클릭하여 선택)</span></label>
              <input type="hidden" id="titleCode"/>
              <input type="text" id="titleName" class="input picker-field" readonly
                     data-target="titleCode" placeholder="클릭하여 선택" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>상태 <span class="req">*</span> <span class="form-hint">(클릭하여 선택)</span></label>
              <input type="hidden" id="statusCode"/>
              <input type="text" id="statusName" class="input picker-field" readonly
                     data-target="statusCode" placeholder="클릭하여 선택" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>주요업무</label>
              <input type="text" id="mainTask" class="input" autocomplete="off"/>
            </div>
            <div class="form-group">
              <label>출입시작일 <span class="req">*</span></label>
              <input type="date" id="accessStartDt" class="input"/>
            </div>
            <div class="form-group">
              <label>출입종료일 <span class="req">*</span></label>
              <input type="date" id="accessEndDt" class="input" max="2037-12-31"/>
            </div>
            <div class="form-group full">
              <label>메모</label>
              <input type="text" id="remark" class="input" autocomplete="off"/>
            </div>
          </div>

          <div class="form-group-label" style="margin-top:12px">얼굴</div>
          <div class="face-box">
            <img id="facePreview" class="face-preview" alt="얼굴 미리보기"/>
            <div class="face-actions">
              <input type="file" id="faceFile" accept="image/*" class="input"/>
              <button type="button" class="btn" id="btnCapture">장치에서 촬영</button>
              <button type="button" class="btn" id="btnFaceClear">얼굴 지우기</button>
              <span class="form-hint">파일을 올리면 BiostarX 가 정규화한 얼굴을 사용합니다.
                촬영은 로그인 계정에 지정된 장치(dev_id)로 수행합니다.</span>
            </div>
          </div>
        </form>
      </div>

      <!-- 탭2: 사용자 권한 (tb_ac_group 선택) -->
      <div class="tab-panel" id="tab-auth">
        <p class="form-hint">출입을 허용할 출입권한(BiostarX 출입그룹)을 선택하세요.</p>
        <div class="ac-select-tree" id="acTree">
          <div class="empty">불러오는 중...</div>
        </div>
      </div>

      <!-- 탭3: 카드정보 (추후) -->
      <div class="tab-panel" id="tab-card">
        <p class="form-hint">카드 등록은 추후 제공됩니다.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="btnCancel">취소</button>
      <button class="btn btn-primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- 기관 선택 팝업 (tb_company) -->
<div class="modal-overlay code-picker-overlay" id="companyModal">
  <div class="modal-container wide">
    <div class="modal-header">
      <h2 class="modal-title">기관 선택</h2>
      <button class="modal-close" id="companyClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="search-keyword" style="margin-bottom:10px">
        <input type="text" id="companyFilterKw" class="input" placeholder="기관코드 또는 기관명으로 검색" autocomplete="off"/>
      </div>
      <p class="form-hint" id="companyInfo"></p>
      <div class="matrix-wrap">
        <table class="grid">
          <thead>
          <tr><th class="w-40"></th><th class="w-160">기관코드</th><th style="text-align:left">기관명</th></tr>
          </thead>
          <tbody id="companyList">
          <tr><td colspan="3" class="empty">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="companyCancel">취소</button>
      <button class="btn btn-primary" id="companyConfirm">선택</button>
    </div>
  </div>
</div>

<div th:replace="~{fragments/components/confirm-modal :: confirmModal}"></div>
<div th:replace="~{fragments/components/code-picker-modal :: codePicker}"></div>

<script th:inline="javascript">
  window.PAGE_PERM = {
    canCreate: [[${perm.canCreate}]],
    canDelete: [[${perm.canDelete}]]
  };
</script>
<script src="/js/web/person/person.js" defer></script>
</body>
</html>
