spring.application.name=cjairport

# ===== 서버 =====
server.port=${SERVER_PORT:8080}
# 유휴 세션 만료 — 마지막 서버 요청 기준. 방문객 등록처럼 입력이 긴 작업 중 만료되지 않게 1시간.
server.servlet.session.timeout=1h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SSL_ENABLED:false}
# 운영은 SSL 활성화 (docs/deployment.md)
server.ssl.enabled=${SSL_ENABLED:false}

# ===== DB: MSSQL 단일 (비밀값은 환경변수/.env 로 주입, 커밋 금지) =====
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_MSSQL_URL:jdbc:sqlserver://localhost:1433;databaseName=CJ_AIRPORT;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_MSSQL_USERNAME:sa}
spring.datasource.password=${DB_MSSQL_PASSWORD:}
# 커넥션 풀 — BiostarX 동기화가 트랜잭션 안에서 일어나므로(실패 시 롤백 정책) 저장 1건이 외부 응답을
# 기다리는 동안 커넥션을 점유한다. 기본 10 이면 등록 10건만으로 풀이 말라 조회까지 멈춘다.
# 동시 사용자 수보다 넉넉히 잡는다. (docs/deployment.md)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
# 풀이 말랐을 때 무한 대기하지 않고 실패시킨다 — 화면이 멈춘 채로 있는 것보다 사유가 보이는 편이 낫다.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
# 이 시간을 넘겨 반납되지 않으면 경고 로그를 남긴다(외부 연동이 트랜잭션을 오래 잡는지 추적용)
spring.datasource.hikari.leak-detection-threshold=60000

# ===== MyBatis =====
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ===== Thymeleaf =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ===== 파일 업로드(엑셀 일괄등록 등) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== 인코딩 =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== 로깅 (구조화: requestId/userId 는 MdcFilter 가 주입 — docs/backend.md) =====
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{userId:-}] %logger{36} - %msg%n
# 파일 로그 — 윈도우 서비스(NSSM 등)로 돌리면 콘솔이 없어 로그가 사라진다. 경로는 LOG_PATH 로 덮어쓸 수 있다
# (서비스는 작업 디렉터리가 달라질 수 있으므로 운영은 절대경로 권장: LOG_PATH=D:/cjairport/logs).
logging.file.name=${LOG_PATH:logs}/cjairport.log
logging.pattern.file=${logging.pattern.console}
# 하루 단위 + 50MB 초과 시 분할, 30일/총 1GB 까지 보관(넘으면 오래된 것부터 삭제)
logging.logback.rollingpolicy.file-name-pattern=${LOG_PATH:logs}/cjairport.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
# 기동 시 남은 오래된 로그도 정리 대상에 포함
logging.logback.rollingpolicy.clean-history-on-start=true

# ── 접근 로그 (요청 1건 = 1줄) ────────────────────────────────────
# 위 cjairport.log 는 '기동·오류·경고'만 남는다 — 정상 조회·저장은 INFO 레벨에서 아무 로그도
# 남기지 않으므로, 종일 정상 운영하면 파일이 자라지 않고 자정이 지나도 새 파일이 생기지 않는다
# (로그백 롤오버는 '기간이 바뀐 뒤 첫 로그 이벤트'에 일어난다). 그래서 시스템이 죽은 것처럼 보인다.
# 접근 로그는 요청마다 한 줄을 남겨 '살아서 처리 중'임을 파일로 확인할 수 있게 한다.
server.tomcat.accesslog.enabled=${ACCESS_LOG:true}
server.tomcat.accesslog.directory=${LOG_PATH:logs}
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
# 시각 · 클라이언트IP · 요청 · 상태코드 · 응답크기 · 처리시간
# %D 는 Tomcat 10 부터 마이크로초라 오해를 부른다 → 밀리초는 %{ms}T 를 쓴다.
# 세션ID(%S)는 넣지 않는다 — 로그가 유출되면 세션 탈취에 쓰인다(security.md).
server.tomcat.accesslog.pattern=%{yyyy-MM-dd HH:mm:ss}t %a "%r" %s %b %{ms}Tms
server.tomcat.accesslog.max-days=60
# 버퍼링을 끄면 요청 즉시 파일에 반영된다(장애 시 마지막 요청까지 남는다)
server.tomcat.accesslog.buffered=false

# ===== ARIA 암호화 키 (운영은 환경변수/Jasypt 로 주입 — 하드코딩 금지, docs/security.md) =====
app.crypto.aria-key=${ARIA_KEY:01234567890123456789012345678901}

# ===== 카드 프린트 (외부 프린터 연동 — adapter/cardprint) =====
# 디자인 export(card_project) JSON 경로. 대용량이라 저장소 제외(card-templates/, .gitignore)
card-print.project-file=card-templates/card_project.json
# 디자인 캔버스 가로 폭(요소 좌표계) — 배경 이미지 해상도로 스케일할 기준. 요소 중심≈절반
card-print.canvas-width=540
# 인쇄는 클라이언트 브라우저(window.print)로 하므로 프린터명·오프셋·배율 설정은 불필요(제거).
