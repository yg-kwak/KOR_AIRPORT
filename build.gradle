plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'AirPort'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	// mavenCentral 하나만 본다. eGovFrame 저장소(maven.egovframe.go.kr)는 국내망 밖에서
	// 닿지 않아 CI 빌드가 의존성 해석 단계에서 죽었다(2026-08 확인). 그 의존성을 쓰지
	// 않으므로 저장소째 뺀다 — 폐쇄망·해외망 어디서 빌드해도 mavenCentral 만 있으면 된다.
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 퍼시스턴스: MyBatis (JPA 미사용)
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	// DB: MSSQL 단일
	implementation 'com.microsoft.sqlserver:mssql-jdbc:12.4.1.jre11'

	// 유틸
	implementation 'org.apache.commons:commons-lang3:3.14.0'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	// 프로퍼티 암호화
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
	// 구조 테스트 — 계층 경계·네이밍을 테스트로 강제 (docs/conventions.md §9)
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 포맷터: google-java-format (docs/conventions.md)
spotless {
	java {
		googleJavaFormat('1.19.2')
		target 'src/**/*.java'
	}
}
